<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETCIDE - Deliberações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="./">
                <img src="img/logo.png" alt="PETCIDE" width="80" height="80" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="./">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="deliberacoes.html">Deliberações</a></li>
                    <li class="nav-item"><a class="nav-link" href="similaridade.html">Análise de Similaridade</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <h2 class="mb-0">Deliberações</h2>
            <a class="btn btn-dark" href="https://github.com/PET-CeT/PETCIDE/issues/new?template=nova-deliberacao.yml"
                target="_blank" rel="noopener">
                <i class="bi bi-plus-circle"></i> Sugerir deliberação
            </a>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Filtros</h5>
                <form id="filtroForm" class="row g-3">
                    <div class="col-md-2">
                        <label for="ano" class="form-label">Ano</label>
                        <select class="form-select" id="ano">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="evento" class="form-label">Evento</label>
                        <input type="text" class="form-control" id="evento" placeholder="Ex.: ENAPET, GDT 3">
                    </div>
                    <div class="col-md-4">
                        <label for="busca" class="form-label">Texto da deliberação</label>
                        <input type="text" class="form-control" id="busca" placeholder="Ex.: custeio">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-dark w-100">Filtrar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <p class="text-muted small" id="contagem"></p>
                <div class="table-responsive">
                    <table class="table table-striped" id="tabelaDeliberacoes">
                        <thead>
                            <tr>
                                <th class="d-none d-md-table-cell">ID</th>
                                <th>Evento</th>
                                <th>Ano</th>
                                <th>Descrição</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5" class="text-center">Carregando…</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav aria-label="Navegação de página">
                    <ul class="pagination justify-content-center flex-wrap" id="paginacao"></ul>
                </nav>
            </div>
        </div>

        <div class="modal fade" id="eventoModal" tabindex="-1" aria-labelledby="eventoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="eventoModalLabel"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <p class="text-muted" id="eventoModalInfo"></p>
                        <p class="texto-longo" id="eventoModalDescricao"></p>
                    </div>
                    <div class="modal-footer">
                        <a class="btn btn-dark" id="eventoModalComparar" href="#">
                            <i class="bi bi-search"></i> Buscar parecidas em outros anos
                        </a>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-light py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">PET C&amp;T UFAL - PETCIDE ·
                <a href="https://github.com/PET-CeT/PETCIDE" class="link-dark">código no GitHub</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/deliberacoes.js"></script>
</body>

</html>
