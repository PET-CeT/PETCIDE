{% extends 'base.html' %}

{% block title %}Registro - PETCIDE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Registrar Conta</h4>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nome de usuário</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label">Confirmar Senha</label>
                        <input type="password" class="form-control" id="password2" name="password2" required>
                    </div>
                    <div class="alert alert-danger d-none" id="registerError"></div>
                    <button type="submit" class="btn btn-dark">Registrar</button>
                </form>
                <div class="mt-3">
                    <p>Já tem uma conta? <a href="{% url 'login' %}">Faça login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('registerForm');
        
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const errorDiv = document.getElementById('registerError');
            
            // Limpar mensagens de erro anteriores
            errorDiv.classList.add('d-none');
            
            // Validação básica
            if (password !== password2) {
                errorDiv.textContent = 'As senhas não coincidem.';
                errorDiv.classList.remove('d-none');
                return;
            }
            
            // Fazer requisição para a API de registro
            fetch('/api/users/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password,
                    password2: password2
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error || data.username || data.email || data.password) {
                    // Exibir erro
                    let errorMsg = data.error || '';
                    if (data.username) errorMsg += data.username.join('. ') + '\n';
                    if (data.email) errorMsg += data.email.join('. ') + '\n';
                    if (data.password) errorMsg += data.password.join('. ') + '\n';
                    
                    errorDiv.textContent = errorMsg || 'Erro ao registrar. Verifique os dados.';
                    errorDiv.classList.remove('d-none');
                } else {
                    // Registro bem-sucedido
                    alert('Registro realizado com sucesso! Faça login para continuar.');
                    window.location.href = '/login/';
                }
            })
            .catch(error => {
                console.error('Erro:', error);
                errorDiv.textContent = 'Erro de conexão. Tente novamente.';
                errorDiv.classList.remove('d-none');
            });
        });
    });
    
    // Função para obter o cookie CSRF
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
