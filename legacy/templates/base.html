<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PETCIDE - Sistema de Gestão de Deliberações{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/main.css">

    <link rel="icon" href="/static/images/logo.ico" type="image/x-icon">

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/static/images/logo.png" alt="logo" width="80" height="80" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'textos' %}">Deliberações</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'similaridade' %}">Análise de Similaridade</a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item" id="navLogin">
                        <a class="nav-link" href="{% url 'login' %}">Login</a>
                    </li>
                    <li class="nav-item dropdown d-none" id="navUser">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                            data-bs-toggle="dropdown">
                            <span id="username">Usuário</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="{% url 'profile' %}">Meu Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout">Sair</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-light py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2025 PET C&T UFAL - Sistema de Gestão de Deliberações</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="/static/js/main.js"></script>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (token && user) {
                // Usuário autenticado
                document.getElementById('navLogin').classList.add('d-none');
                document.getElementById('navUser').classList.remove('d-none');
                document.getElementById('username').textContent = user.username;

                // Adicionar evento de logout
                document.getElementById('logout').addEventListener('click', function (e) {
                    e.preventDefault();
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('user');
                    window.location.href = '/';
                });
            } else {
                // Usuário não autenticado
                document.getElementById('navLogin').classList.remove('d-none');
                document.getElementById('navUser').classList.add('d-none');
            }
        });

        function authenticatedFetch(url, options = {}) {
            const token = localStorage.getItem('authToken');

            if (!token) {
                window.location.href = '/login/';
                return new Promise((resolve, reject) => {
                    reject('Usuário não autenticado');
                });
            }

            // Adicionar token ao cabeçalho Authorization
            const headers = options.headers || {};
            headers['Authorization'] = `Token ${token}`;
            headers['X-CSRFToken'] = getCookie('csrftoken');

            return fetch(url, {
                ...options,
                headers: headers
            });
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
